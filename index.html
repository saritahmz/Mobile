<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8a4fff">
  <meta name="description" content="Compare preços de produtos de maquiagem em diferentes lojas.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>BeautyCompare</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Seu comparador de beleza</p>
        <h1>BeautyCompare</h1>
      </div>
      <button class="icon-button" type="button" aria-label="Favoritos">♡</button>
    </header>

    <main>
      <section class="intro">
        <h2>Compare antes de comprar</h2>
        <p>Digite a marca e a categoria para encontrar as melhores opções de preço.</p>
      </section>

      <section class="search-card" aria-label="Pesquisar maquiagem">
        <div class="field">
          <label for="brand">Marca</label>
          <input id="brand" type="text" placeholder="Ex.: Maybelline" autocomplete="off">
        </div>

        <div class="field">
          <label for="category">Categoria</label>
          <input id="category" type="text" placeholder="Ex.: Base" autocomplete="off">
        </div>

        <button id="searchButton" class="search-button" type="button">⌕ Pesquisar</button>
      </section>

      <section class="results-section">
        <div class="results-header">
          <div>
            <p class="eyebrow">Resultados</p>
            <h2>Produtos encontrados</h2>
          </div>
          <span id="resultCount" class="result-count">0 produtos</span>
        </div>

        <div id="statusMessage" class="status-message">Digite uma marca e uma categoria para começar.</div>
        <div id="productList" class="product-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item active" type="button"><span>⌂</span><small>Início</small></button>
      <button class="nav-item" type="button"><span>♡</span><small>Favoritos</small></button>
      <button class="nav-item" type="button"><span>↺</span><small>Histórico</small></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
